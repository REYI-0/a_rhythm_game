<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound Rhythm 3D</title>
<style>
:root{--bg:#0a0a16;--panel:#13163a;--line:#3a4290;--acc:#5ee6ff;--txt:#e8ecff}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,'Malgun Gothic',sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.screen.on{display:flex}
button{font:inherit;color:inherit;background:#1a1f4d;border:2px solid var(--line);border-radius:10px;padding:10px 20px;cursor:pointer}
button:hover,button:focus-visible{background:#2a3280;outline:none}
button.sel{background:var(--acc);color:#04121a;border-color:#fff}
h1{font-size:clamp(2rem,7vw,4.5rem);margin:0;letter-spacing:.18em}
h2{margin:0 0 12px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px;min-width:240px}
#list button{display:block;width:100%;margin:6px 0}
#diffs button,#diffs i{width:120px;height:44px;box-sizing:border-box;padding:0}
#diffs i{display:inline-block;border:2px dashed #2a2f66;border-radius:10px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s}
small{opacity:.7}
</style></head><body>
<canvas id="c"></canvas>
<div id="intro" class="screen on"><h1>SOUND RHYTHM</h1><button id="play">PLAY</button></div>
<div id="select" class="screen"><div class="row">
 <div class="panel" id="list"></div>
 <div class="panel"><h2 id="sname"></h2><div class="row" id="diffs"></div>
  <p><label><small>내 음악 파일 불러오기(선택)</small><br><input type="file" id="file" accept="audio/*"></label></p>
  <button id="start">START</button></div></div></div>
<div id="result" class="screen"><div class="panel"><h2>RESULT</h2><p id="rtxt"></p><button id="back">노래 선택으로</button></div></div>
<div id="fade"></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
let W,H;const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};addEventListener('resize',rs);rs();
const show=n=>['intro','select','result'].forEach(s=>$(s).classList.toggle('on',s===n));
const N=(b,c)=>({b,c}),gen=(s,e,st,p)=>{const a=[];let i=0;for(let b=s;b<e;b+=st)a.push(N(b,p[i++%p.length]));return a};
// 곡 데이터 (박 단위). sb/eb=시작/끝 박, lead=시작 후 첫 노트까지 대기(초), vol/col=[박,값,지속박]
const SONGS=[
{name:'The Sky',bpm:127,off:0,sb:17,eb:30,lead:5,vol:[[17,1,0],[25,0,4]],col:[[23,'#8c33cc',2]],diffs:[
 {n:'Easy',lv:2,sp:4,spd:[[23,8]],notes:[N(17,0),N(18,1),N(19,2),N(20,3),N(21,4),N(21.5,4),N(22,4),N(22.5,4),N(23,8),N(23.5,8),N(24,8),N(24.5,8)]},
 {n:'Normal',lv:5,sp:4,spd:[[23,8]],notes:gen(17,29.5,.5,[0,1,2,5,8,7,6,3,4])}]},
{name:'Neon Night',bpm:140,off:0,sb:8,eb:30,lead:3,vol:[[8,1,0],[26,0,4]],col:[[16,'#cc3366',2]],diffs:[
 {n:'Normal',lv:4,sp:4,spd:[],notes:gen(8,29,1,[4,0,2,8,6,1,7])},
 {n:'Hard',lv:7,sp:6,spd:[[20,9]],notes:gen(8,29.5,.5,[0,4,8,2,4,6,1,5,7,3])}]},
{name:'Last Dawn',bpm:100,off:0,sb:4,eb:24,lead:3,vol:[[4,1,0],[20,0,4]],col:[[12,'#2a7fff',2]],diffs:[
 {n:'Easy',lv:1,sp:3,spd:[],notes:gen(4,23,1,[4,1,7,3,5])},
 {n:'Normal',lv:4,sp:4,spd:[],notes:gen(4,23.5,.5,[0,1,2,5,8,7,6,3])}]}];
let si=0,di=0,ac,G=null;
function build(){const L=$('list');L.innerHTML='';
 SONGS.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.name+(s.buf?' ♪':'');b.className=i==si?'sel':'';b.onclick=()=>{si=i;di=0;build()};L.appendChild(b)});
 const s=SONGS[si];$('sname').textContent=s.name;const D=$('diffs');D.innerHTML='';
 for(let i=0;i<3;i++){const d=s.diffs[i];if(!d){D.appendChild(document.createElement('i'));continue}
  const b=document.createElement('button');b.textContent=`${d.n} (${d.lv})`;b.className=i==di?'sel':'';b.onclick=()=>{di=i;build()};D.appendChild(b)}}
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;ac=ac||new AudioContext();
 try{SONGS[si].buf=await ac.decodeAudioData(await f.arrayBuffer());build()}catch{alert('음악 파일을 읽지 못했어요. mp3, ogg, wav를 사용하세요.')}};
$('play').onclick=()=>{show('select');build()};$('back').onclick=()=>{show('select');build()};
$('start').onclick=()=>{const f=$('fade');f.style.opacity=1;ac=ac||new AudioContext();ac.resume();cv.requestPointerLock?.();
 setTimeout(()=>{show('');startGame();f.style.opacity=0},850)};

const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const ev=(list,init,lp,bs,spb)=>t=>{let v=init;for(const[b,x,du]of list){const a=bs(b),w=du*spb;if(t<a)break;if(w<=0||t>=a+w){v=x;continue}return lp(v,x,(t-a)/w)}return v};
function startGame(){
 const s=SONGS[si],d=s.diffs[di],q=new URLSearchParams(location.search).get('beat'),pb=q!==null?+q:s.sb;  // ?beat=22 로 중간부터 테스트
 const spb=60/s.bpm,bs=b=>s.off+b*spb,U=40/(4*1.6),seg=[[-1e5,d.sp*U,0]];
 d.spd.slice().sort((a,b)=>a[0]-b[0]).forEach(([b,sp])=>{const L=seg[seg.length-1],t=bs(b);seg.push([t,sp*U,L[2]+L[1]*(t-L[0])])});
 const dist=t=>{let i=seg.length-1;while(i>0&&seg[i][0]>t)i--;return seg[i][2]+seg[i][1]*(t-seg[i][0])};
 const spawnT=(a,D)=>{const tg=dist(a)-D;let i=seg.length-1;while(i>0&&seg[i][2]>tg)i--;return seg[i][0]+(tg-seg[i][2])/seg[i][1]};
 const ms=bs(pb),et=bs(s.eb),lead=Math.max(s.lead,ms-spawnT(ms,40)+.1);
 const notes=d.notes.map(n=>({t:bs(n.b),c:n.c})).sort((a,b)=>a.t-b.t).filter(n=>n.t>=ms-1e-4&&n.t<=et);notes.forEach(n=>n.d=dist(n.t));
 const gn=ac.createGain();gn.connect(ac.destination);const t0=ac.currentTime+.2;let src=null;
 if(s.buf){src=ac.createBufferSource();src.buffer=s.buf;src.connect(gn);src.start(t0+lead,Math.min(ms,s.buf.duration-.01))}
 else for(let b=Math.ceil(pb);b<=s.eb;b++){const tt=t0+lead+bs(b)-ms,o=ac.createOscillator(),e=ac.createGain();o.frequency.value=b%4?440:880;
  o.connect(e);e.connect(gn);e.gain.setValueAtTime(.35,tt);e.gain.exponentialRampToValueAtTime(.001,tt+.06);o.start(tt);o.stop(tt+.07)}
 G={s,d,notes,idx:0,act:[],t0,st0:ms-lead,et,dist,gn,src,hit:0,miss:0,score:0,combo:0,cx:0,cy:0,fx:[],done:false,
  vol:ev(s.vol,1,(a,b,k)=>a+(b-a)*k,bs,spb),col:ev(s.col.map(([b,h,du])=>[b,hex(h),du]),[10,10,22],(a,b,k)=>a.map((x,i)=>x+(b[i]-x)*k),bs,spb)};
}
const mult=()=>G.combo>=30?8:G.combo>=20?4:G.combo>=10?2:1,cl=(v,m)=>Math.max(-m,Math.min(m,v));
addEventListener('mousemove',e=>{if(!G||G.done)return;
 if(document.pointerLockElement===cv){G.cx=cl(G.cx+e.movementX*.01,1.475);G.cy=cl(G.cy-e.movementY*.01,1.475)}
 else{const k=.275*H;G.cx=cl((e.clientX-W/2)/k,1.475);G.cy=cl(-(e.clientY-H/2)/k,1.475)}});
function judge(n,T){const px=(n.c%3-1)*1.1,py=(Math.floor(n.c/3)-1)*1.1,h=(.9+.25)/2;
 const ok=Math.abs(G.cx-px)<h&&Math.abs(G.cy-py)<h;
 if(ok){G.hit++;G.combo++;G.score+=300*mult()}else{G.miss++;G.combo=0}G.fx.push({x:px,y:py,t:T,ok})}
function finish(){G.done=true;G.src&&G.src.stop();G.gn.disconnect();document.exitPointerLock?.();
 const n=G.hit+G.miss;$('rtxt').innerHTML=`${G.s.name} · ${G.d.n}<br>SCORE ${G.score}<br>HIT ${G.hit} / MISS ${G.miss}<br>정확도 ${n?Math.round(G.hit/n*100):0}%`;G=null;show('result')}
const f=()=>H*2.2,P=(x,y,z)=>{const k=f()/(z+8);return[W/2+x*k,H/2-y*k,k]};
function board(){g.strokeStyle='#4b57c8';g.lineWidth=2;for(let c=0;c<9;c++){const x=(c%3-1)*1.1,y=(Math.floor(c/3)-1)*1.1,a=P(x,y,0),k=a[2];g.strokeRect(a[0]-k/2,a[1]-k/2,k,k)}}
function hud(T){g.fillStyle='#e8ecff';g.font=`600 ${H*.04}px system-ui`;g.textAlign='left';
 [`HIT ${G.hit}`,`MISS ${G.miss}`,`SCORE ${G.score}`,`COMBO ${G.combo}`].forEach((t,i)=>g.fillText(t,W*.03,H*.2+i*H*.07));
 g.textAlign='right';const e=Math.max(0,T-G.st0);g.fillText(`${String(Math.floor(e/60)).padStart(2,'0')}:${String(Math.floor(e%60)).padStart(2,'0')}`,W*.97,H*.2);
 g.font=`700 ${H*.09}px system-ui`;g.fillStyle=mult()>1?'#ffd25e':'#e8ecff';g.fillText('x'+mult(),W*.97,H*.34)}
function frame(){requestAnimationFrame(frame);
 if(!G){g.fillStyle='#0a0a16';g.fillRect(0,0,W,H);board();return}
 const T=G.st0+ac.currentTime-G.t0,dn=G.dist(T),c=G.col(T);
 G.gn.gain.value=G.vol(T);
 while(G.idx<G.notes.length&&G.notes[G.idx].d-dn<=40)G.act.push(G.notes[G.idx++]);
 for(let i=G.act.length-1;i>=0;i--)if(T>=G.act[i].t){judge(G.act[i],T);G.act.splice(i,1)}
 if(T>=G.et){finish();return}
 g.fillStyle=`rgb(${c.map(Math.round)})`;g.fillRect(0,0,W,H);board();
 for(let i=G.act.length-1;i>=0;i--){const n=G.act[i],z=n.d-dn,p=P((n.c%3-1)*1.1,(Math.floor(n.c/3)-1)*1.1,z),s=.9*p[2];
  g.globalAlpha=Math.max(0,Math.min(1,(40-z)/8));g.fillStyle='#5ee6ff';g.fillRect(p[0]-s/2,p[1]-s/2,s,s);g.globalAlpha=1}
 G.fx=G.fx.filter(e=>T-e.t<.3);G.fx.forEach(e=>{const p=P(e.x,e.y,0),r=(T-e.t)/.3;g.strokeStyle=e.ok?'#7dff9b':'#ff5a6e';g.globalAlpha=1-r;g.lineWidth=4;g.strokeRect(p[0]-p[2]*(.5+r*.3),p[1]-p[2]*(.5+r*.3),p[2]*(1+r*.6),p[2]*(1+r*.6));g.globalAlpha=1});
 const cp=P(G.cx,G.cy,-.1),cs=.25*cp[2];g.fillStyle='#ff4fa3';g.fillRect(cp[0]-cs/2,cp[1]-cs/2,cs,cs);
 hud(T)}
frame();
</script></body></html>
